  <text x="625" y="308" fill="#1a1b2e" font-size="10">agent/tool/builtin — 内置工具</text>
  <text x="625" y="325" fill="#1a1b2e" font-size="10">agent/tool/skill — Skill 后端</text>
  <text x="625" y="342" fill="#1a1b2e" font-size="10">agent/tool/mcp — MCP 客户端</text>
  <text x="625" y="360" fill="#1a1b2e" font-size="9" opacity="0.65">ask_user·bash·websearch·webfetch·task</text>
  <text x="625" y="374" fill="#1a1b2e" font-size="9" opacity="0.65">memory_save·memory_forget·memory_list</text>

  <line x1="165" y1="383" x2="165" y2="398" stroke="#10b981" stroke-width="2"/>
  <line x1="450" y1="383" x2="450" y2="398" stroke="#10b981" stroke-width="2"/>
  <line x1="735" y1="383" x2="735" y2="398" stroke="#f59e0b" stroke-width="2"/>
  <line x1="165" y1="393" x2="735" y2="393" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="450" y1="393" x2="450" y2="398" stroke="#f59e0b" stroke-width="2"/>

