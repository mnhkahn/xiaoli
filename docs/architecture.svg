  <text x="55" y="168" fill="#064e3b" font-size="11" opacity="0.85">server.go — ServeHTTP 多路分发</text>
  <text x="55" y="180" fill="#064e3b" font-size="10" opacity="0.65">/health · /xiaozhi/ota/ · /xiaozhi/v1/(WS) · /lark/events · /mcp/vision/ · /admin/*</text>

