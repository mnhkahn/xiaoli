  <text x="55" y="238" fill="#064e3b" font-size="11" opacity="0.85">agent/channel · channel.go — Provider 注册 · ConversationPipeline</text>
  <text x="55" y="250" fill="#064e3b" font-size="10" opacity="0.65">agent/channel/lark (WS) · agent/channel/wechat (轮询) · agent/esp32/hub (Device WS) · agent/slash (斜杠命令)</text>

  <line x1="165" y1="253" x2="165" y2="268" stroke="#10b981" stroke-width="2"/>
  <line x1="450" y1="253" x2="450" y2="268" stroke="#10b981" stroke-width="2"/>
  <line x1="735" y1="253" x2="735" y2="268" stroke="#10b981" stroke-width="2"/>

