  <text x="55" y="342" fill="#064e3b" font-size="10">agent/slash — 斜杠命令</text>
  <text x="55" y="360" fill="#064e3b" font-size="9" opacity="0.65">/skills·/model·/channel·/status·/new·/sessions·/session</text>
  <text x="55" y="374" fill="#064e3b" font-size="9" opacity="0.65">/compact·/memory·/cron·/mcp·/task·/help</text>

