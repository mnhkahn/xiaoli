  <text x="340" y="325" fill="#064e3b" font-size="10">ASR: OpenAITranscriber (direct_ai)</text>
  <text x="340" y="342" fill="#064e3b" font-size="10">VLLM: GoVisionClient (direct_vision)</text>
  <text x="340" y="360" fill="#064e3b" font-size="10">TTS: HTTPSpeechSynthesizer (direct_tts)</text>
