  <text x="55" y="456" fill="#064e3b" font-size="10" opacity="0.65">LLM 调用统计 · 工具调用统计 · 重试策略 · Stream Hub 帧转发 · 设备 Token</text>

  <line x1="450" y1="463" x2="450" y2="478" stroke="#10b981" stroke-width="2"/>

  <rect x="30" y="478" width="840" height="55" rx="8" fill="url(#done)" filter="url(#shadow)" opacity="0.95"/>
  <text x="55" y="500" fill="#064e3b" font-size="13" font-weight="bold">设备协议层</text>
  <text x="55" y="518" fill="#064e3b" font-size="11" opacity="0.85">agent/esp32 — DeviceHub · 会话管理 · MCP 代理 · Voice 处理</text>
  <text x="55" y="530" fill="#064e3b" font-size="10" opacity="0.65">agent/esp32/audio — Ogg Opus 编解码 · VadSilero 语音活动检测</text>

  <line x1="450" y1="533" x2="450" y2="548" stroke="#10b981" stroke-width="2"/>

  <rect x="100" y="548" width="700" height="45" rx="8" fill="#252640" opacity="0.9" stroke="#4b5563" stroke-width="1"/>
  <text x="450" y="568" text-anchor="middle" fill="#9ca3af" font-size="11">外部依赖</text>
  <text x="450" y="584" text-anchor="middle" fill="#6b7280" font-size="10">SiliconFlow · OpenRouter · ARK · Fly.io (nrt) · Redis · Logto · Lark · 微信</text>

  <rect x="300" y="610" width="300" height="32" rx="6" fill="#252640" opacity="0.9"/>
  <rect x="315" y="620" width="14" height="14" rx="3" fill="url(#done)"/>
  <text x="335" y="632" fill="#34d399" font-size="10">已实现</text>
  <rect x="415" y="620" width="14" height="14" rx="3" fill="url(#in-progress)"/>
  <text x="435" y="632" fill="#fbbf24" font-size="10">迭代中</text>
