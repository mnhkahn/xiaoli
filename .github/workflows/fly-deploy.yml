name: Fly Deploy

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".dockerignore"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          echo "Action: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - id: cyeam
        name: Resolve cyeam release tag
        shell: bash
        run: |
          version="$(git ls-remote --tags --refs https://github.com/mnhkahn/cyeam-cli.git \
            | awk -F/ '$3 ~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/ {print $3}' \
            | sort -V \
            | tail -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: |
          flyctl deploy . -c server/fly.toml --dockerfile server/Dockerfile --remote-only \
            --build-arg "CYEAM_VERSION=${{ steps.cyeam.outputs.version }}" \
            --build-arg "XIAOLI_SKILLS_CACHE_BUST=${{ github.sha }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
